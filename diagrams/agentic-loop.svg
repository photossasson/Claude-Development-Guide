<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4552d"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#c9c2b8; stroke-width:1.5; rx:12; }
    .accent { fill:#f3e3da; stroke:#b4552d; }
    .t { font-size:17px; fill:#1a1a1a; text-anchor:middle; direction:rtl; }
    .s { font-size:13px; fill:#6b6b6b; text-anchor:middle; direction:rtl; }
    .en { font-size:13px; fill:#6b6b6b; text-anchor:middle; }
    .edge { stroke:#b4552d; stroke-width:2; fill:none; marker-end:url(#arr); }
  </style>
  <text x="410" y="34" class="t" font-size="21" font-weight="bold">ה-Agentic Loop של Claude Code</text>

  <!-- top: prompt -->
  <rect x="310" y="60" width="200" height="64" rx="12" class="box accent"/>
  <text x="410" y="87" class="t">הנחיה מהמפתח</text>
  <text x="410" y="108" class="en">Prompt</text>

  <!-- right: think/plan -->
  <rect x="560" y="180" width="210" height="76" rx="12" class="box"/>
  <text x="665" y="208" class="t">חשיבה ותכנון</text>
  <text x="665" y="230" class="en">Reasoning + Plan</text>

  <!-- bottom right: tools -->
  <rect x="470" y="330" width="300" height="120" rx="12" class="box"/>
  <text x="620" y="358" class="t">הפעלת Tools</text>
  <text x="620" y="382" class="en">Read / Edit / Write / Bash</text>
  <text x="620" y="402" class="en">Grep / Glob / WebFetch / MCP</text>
  <text x="620" y="430" class="s">בכפוף ל-Permissions</text>

  <!-- bottom left: observe -->
  <rect x="60" y="330" width="300" height="120" rx="12" class="box"/>
  <text x="210" y="358" class="t">בחינת התוצאה</text>
  <text x="210" y="382" class="en">Diff / Test output / Errors</text>
  <text x="210" y="410" class="s">האם המשימה הושלמה?</text>
  <text x="210" y="430" class="s">אם לא: חוזרים לתכנון</text>

  <!-- left: answer -->
  <rect x="60" y="180" width="210" height="76" rx="12" class="box accent"/>
  <text x="165" y="208" class="t">תשובה ושינויים</text>
  <text x="165" y="230" class="en">Response + Diffs</text>

  <!-- edges: clockwise -->
  <path class="edge" d="M 510 108 C 600 120 640 140 660 176"/>
  <path class="edge" d="M 665 258 L 645 326"/>
  <path class="edge" d="M 466 392 L 364 392"/>
  <path class="edge" d="M 200 326 C 180 300 170 285 166 260"/>
  <path class="edge" d="M 270 200 C 320 170 330 150 355 122"/>
  <!-- iterate arrow -->
  <path class="edge" d="M 360 360 C 420 300 500 280 556 240" stroke-dasharray="6 5"/>
  <text x="470" y="292" class="s">איטרציה נוספת במידת הצורך</text>
</svg>
