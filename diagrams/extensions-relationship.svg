<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4552d"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#c9c2b8; stroke-width:1.5; }
    .accent { fill:#f3e3da; stroke:#b4552d; }
    .plug { fill:#faf6f1; stroke:#b4552d; stroke-width:1.5; stroke-dasharray:7 5; }
    .chip { fill:#ffffff; stroke:#c9c2b8; stroke-width:1.2; }
    .t { font-size:16px; fill:#1a1a1a; text-anchor:middle; direction:rtl; }
    .s { font-size:12.5px; fill:#6b6b6b; text-anchor:middle; direction:rtl; }
    .en { font-size:15px; fill:#1a1a1a; text-anchor:middle; font-weight:bold; }
    .ens { font-size:12px; fill:#6b6b6b; text-anchor:middle; }
    .edge { stroke:#b4552d; stroke-width:2; fill:none; marker-end:url(#arr2); }
  </style>
  <text x="450" y="32" class="t" font-size="21" font-weight="bold">מפת ההרחבות של Claude Code: מי מוסיף מה</text>

  <!-- core -->
  <rect x="340" y="280" width="220" height="84" rx="12" class="box accent"/>
  <text x="450" y="313" class="en" font-size="18">Claude Code</text>
  <text x="450" y="336" class="s">הליבה: לולאת ה-Agent בטרמינל</text>

  <!-- CLAUDE.md top-left -->
  <rect x="60" y="88" width="190" height="76" rx="12" class="box"/>
  <text x="155" y="115" class="en">CLAUDE.md</text>
  <text x="155" y="136" class="t" font-size="14">ידע קבוע על הפרויקט</text>
  <text x="155" y="154" class="ens">Knowledge</text>

  <!-- Skills top-center -->
  <rect x="355" y="66" width="190" height="76" rx="12" class="box"/>
  <text x="450" y="93" class="en">Skills</text>
  <text x="450" y="114" class="t" font-size="14">נהלים והוראות לפי דרישה</text>
  <text x="450" y="132" class="ens">Procedures</text>

  <!-- Hooks top-right -->
  <rect x="650" y="88" width="190" height="76" rx="12" class="box"/>
  <text x="745" y="115" class="en">Hooks</text>
  <text x="745" y="136" class="t" font-size="14">אוטומציה דטרמיניסטית ואכיפה</text>
  <text x="745" y="154" class="ens">Determinism</text>

  <!-- MCP left -->
  <rect x="40" y="268" width="190" height="76" rx="12" class="box"/>
  <text x="135" y="295" class="en">MCP</text>
  <text x="135" y="316" class="t" font-size="14">כלים ומקורות מידע חיצוניים</text>
  <text x="135" y="334" class="ens">External Tools</text>

  <!-- Connectors right -->
  <rect x="670" y="268" width="190" height="76" rx="12" class="box"/>
  <text x="765" y="295" class="en">Connectors</text>
  <text x="765" y="316" class="t" font-size="14">אינטגרציות מוכנות לשירותים</text>
  <text x="765" y="334" class="ens">Integrations (MCP מנוהל)</text>

  <!-- Subagents bottom-left -->
  <rect x="60" y="452" width="190" height="76" rx="12" class="box"/>
  <text x="155" y="479" class="en">Subagents</text>
  <text x="155" y="500" class="t" font-size="14">הקשרים מבודדים במקביל</text>
  <text x="155" y="518" class="ens">Parallel Contexts</text>

  <!-- Plugin container bottom-right -->
  <rect x="470" y="428" width="390" height="206" rx="14" class="plug"/>
  <text x="665" y="456" class="en" font-size="17">Plugin</text>
  <text x="665" y="478" class="t" font-size="13.5">אריזה, גרסאות והפצה דרך Marketplace</text>
  <rect x="490" y="494" width="170" height="40" rx="9" class="chip"/>
  <text x="575" y="512" class="ens">skills/</text>
  <text x="575" y="527" class="s" font-size="11.5">Skills ארוזים</text>
  <rect x="680" y="494" width="160" height="40" rx="9" class="chip"/>
  <text x="760" y="512" class="ens">hooks/hooks.json</text>
  <text x="760" y="527" class="s" font-size="11.5">Hooks ארוזים</text>
  <rect x="490" y="544" width="170" height="40" rx="9" class="chip"/>
  <text x="575" y="562" class="ens">agents/</text>
  <text x="575" y="577" class="s" font-size="11.5">Subagents ארוזים</text>
  <rect x="680" y="544" width="160" height="40" rx="9" class="chip"/>
  <text x="760" y="562" class="ens">.mcp.json</text>
  <text x="760" y="577" class="s" font-size="11.5">שרתי MCP ארוזים</text>
  <text x="665" y="614" class="s" font-size="12">גם: LSP Servers, Output Styles, ‎settings.json</text>

  <!-- edges into the core -->
  <path class="edge" d="M 200 168 C 250 220 300 258 348 284"/>
  <text x="255" y="212" class="s">מוסיף ידע</text>

  <path class="edge" d="M 450 146 L 450 276"/>
  <text x="492" y="212" class="s">מוסיף נהלים</text>

  <path class="edge" d="M 700 168 C 650 220 600 258 552 284"/>
  <text x="655" y="212" class="s">אוכף כללים</text>

  <path class="edge" d="M 234 314 L 336 320"/>
  <text x="285" y="302" class="s">מחבר כלים</text>

  <path class="edge" d="M 666 314 L 564 320"/>
  <text x="618" y="302" class="s">מחבר שירותים</text>

  <path class="edge" d="M 210 448 C 260 420 310 396 356 370"/>
  <text x="252" y="420" class="s">עבודה במקביל</text>

  <path class="edge" d="M 610 424 C 580 408 560 392 540 370"/>
  <text x="620" y="404" class="s">אורז את כולם יחד</text>
</svg>
