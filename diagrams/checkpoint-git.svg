<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4552d"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#c9c2b8; stroke-width:1.5; }
    .accent { fill:#f3e3da; stroke:#b4552d; }
    .gap { fill:#ffffff; stroke:#a8452e; stroke-dasharray:7 5; }
    .t { font-size:17px; fill:#1a1a1a; text-anchor:middle; direction:rtl; }
    .s { font-size:13px; fill:#6b6b6b; text-anchor:middle; direction:rtl; }
    .en { font-size:13px; fill:#6b6b6b; text-anchor:middle; }
    .lbl { font-size:13px; fill:#b4552d; font-weight:bold; text-anchor:middle; direction:rtl; }
    .tl { stroke:#b4552d; stroke-width:2.5; fill:none; marker-end:url(#arr); }
    .edge { stroke:#b4552d; stroke-width:2; fill:none; marker-end:url(#arr); }
    .sync { stroke:#c9c2b8; stroke-width:1.5; stroke-dasharray:5 5; }
  </style>
  <text x="440" y="32" class="t" font-size="21" font-weight="bold">שתי שכבות ביטחון: Checkpoints של ה-Session מול Git</text>

  <!-- session lane -->
  <text x="700" y="72" class="t" font-weight="bold">שכבת ה-Session: Checkpoints</text>
  <text x="470" y="100" class="s">Checkpoint נשמר לפני כל Prompt (עד 100 אחרונים ב-Session)</text>
  <path class="tl" d="M 820 130 L 80 130"/>
  <text x="85" y="112" class="s">עכשיו</text>
  <circle cx="760" cy="130" r="7" fill="#f3e3da" stroke="#b4552d" stroke-width="2"/>
  <circle cx="650" cy="130" r="7" fill="#f3e3da" stroke="#b4552d" stroke-width="2"/>
  <circle cx="540" cy="130" r="7" fill="#f3e3da" stroke="#b4552d" stroke-width="2"/>
  <circle cx="430" cy="130" r="7" fill="#f3e3da" stroke="#b4552d" stroke-width="2"/>
  <circle cx="320" cy="130" r="7" fill="#f3e3da" stroke="#b4552d" stroke-width="2"/>
  <text x="760" y="156" class="en">Prompt 1</text>
  <text x="650" y="156" class="en">Prompt 2</text>
  <text x="540" y="156" class="en">Prompt 3</text>
  <text x="430" y="156" class="en">Prompt 4</text>
  <text x="320" y="156" class="en">Prompt 5</text>

  <!-- sync lines at commit points -->
  <line x1="700" y1="140" x2="700" y2="398" class="sync"/>
  <line x1="470" y1="140" x2="470" y2="398" class="sync"/>

  <!-- what checkpoints capture -->
  <rect x="590" y="180" width="250" height="100" rx="10" class="box accent"/>
  <text x="715" y="206" class="t">מה נשמר ב-Checkpoint</text>
  <text x="715" y="228" class="s">עריכות דרך כלי הקבצים של Claude</text>
  <text x="715" y="246" class="s">ומצב השיחה</text>
  <text x="715" y="268" class="en">/rewind + Esc Esc</text>

  <!-- what falls outside -->
  <rect x="70" y="180" width="340" height="152" rx="10" class="gap"/>
  <text x="240" y="206" class="t">מה ש-Checkpoint לא מכסה</text>
  <text x="240" y="228" class="s">שינויים מפקודות Bash (rm, mv, סקריפטים)</text>
  <text x="240" y="246" class="s">עריכות ידניות ב-Editor מחוץ ל-Session</text>
  <text x="240" y="264" class="s">עריכות של Subagents ו-Sessions מקבילים</text>
  <text x="240" y="282" class="s">בסיסי נתונים ומערכות מרוחקות</text>
  <text x="240" y="306" class="lbl">כאן רק Git (או גיבוי) עוזר</text>
  <path class="edge" d="M 240 332 L 240 396"/>

  <!-- git lane -->
  <text x="740" y="376" class="t" font-weight="bold">שכבת Git: Commits</text>
  <path class="tl" d="M 820 410 L 80 410"/>
  <rect x="693" y="403" width="14" height="14" fill="#ffffff" stroke="#b4552d" stroke-width="2"/>
  <rect x="463" y="403" width="14" height="14" fill="#ffffff" stroke="#b4552d" stroke-width="2"/>
  <rect x="233" y="403" width="14" height="14" fill="#ffffff" stroke="#b4552d" stroke-width="2"/>
  <text x="700" y="440" class="en">Commit</text>
  <text x="470" y="440" class="en">Commit</text>
  <text x="240" y="440" class="en">Commit</text>
  <text x="585" y="300" class="s">נקודת מפגש: Commit</text>
  <text x="585" y="318" class="s">מקבע את כל מצב הקבצים</text>

  <!-- bottom summaries -->
  <rect x="470" y="470" width="350" height="104" rx="10" class="box accent"/>
  <text x="645" y="496" class="t">Checkpoints: רשת ביטחון מקומית</text>
  <text x="645" y="518" class="s">לכל Session; מנוקים אחרי 30 יום</text>
  <text x="645" y="536" class="s">(cleanupPeriodDays), ללא שיתוף</text>
  <text x="645" y="558" class="en">"Local undo"</text>

  <rect x="60" y="470" width="350" height="104" rx="10" class="box"/>
  <text x="235" y="496" class="t">Git: היסטוריה קבועה ומשותפת</text>
  <text x="235" y="518" class="s">Commits, Branches, Pull Requests</text>
  <text x="235" y="536" class="s">כולל שינויים שנעשו דרך Bash</text>
  <text x="235" y="558" class="en">"Permanent history"</text>
</svg>
