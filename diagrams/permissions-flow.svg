<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1020" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b4552d"/>
    </marker>
  </defs>
  <style>
    .box { fill:#ffffff; stroke:#c9c2b8; stroke-width:1.5; }
    .accent { fill:#f3e3da; stroke:#b4552d; }
    .deny { fill:#f6e3e0; stroke:#a8452e; }
    .t { font-size:17px; fill:#1a1a1a; text-anchor:middle; direction:rtl; }
    .s { font-size:13px; fill:#6b6b6b; text-anchor:middle; direction:rtl; }
    .en { font-size:13px; fill:#6b6b6b; text-anchor:middle; }
    .lbl { font-size:13px; fill:#b4552d; font-weight:bold; text-anchor:middle; direction:rtl; }
    .edge { stroke:#b4552d; stroke-width:2; fill:none; marker-end:url(#arr); }
  </style>
  <text x="440" y="32" class="t" font-size="21" font-weight="bold">מסלול ההחלטה של קריאת Tool במערכת ההרשאות</text>

  <!-- A: tool request -->
  <rect x="300" y="50" width="280" height="62" rx="12" class="box accent"/>
  <text x="440" y="76" class="t">Claude מבקש להפעיל Tool</text>
  <text x="440" y="98" class="en">Bash / Edit / WebFetch / MCP</text>
  <path class="edge" d="M 440 112 L 440 148"/>

  <!-- D1: deny -->
  <rect x="300" y="152" width="280" height="62" rx="12" class="box"/>
  <text x="440" y="178" class="t">התאמה לחוק Deny?</text>
  <text x="440" y="200" class="en">permissions.deny</text>
  <rect x="640" y="152" width="200" height="62" rx="12" class="deny"/>
  <text x="740" y="178" class="t">חסימה בכל מצב</text>
  <text x="740" y="200" class="en">Denied</text>
  <path class="edge" d="M 580 183 L 636 183"/>
  <text x="608" y="172" class="lbl">כן</text>
  <path class="edge" d="M 440 214 L 440 250"/>
  <text x="460" y="240" class="lbl">לא</text>

  <!-- D2: ask -->
  <rect x="300" y="254" width="280" height="62" rx="12" class="box"/>
  <text x="440" y="280" class="t">התאמה לחוק Ask?</text>
  <text x="440" y="302" class="en">permissions.ask</text>
  <rect x="640" y="254" width="200" height="76" rx="12" class="box"/>
  <text x="740" y="280" class="t">Prompt תמיד</text>
  <text x="740" y="302" class="s">גם ב-auto</text>
  <text x="740" y="320" class="s">וגם ב-bypassPermissions</text>
  <path class="edge" d="M 580 285 L 636 285"/>
  <text x="608" y="274" class="lbl">כן</text>
  <path class="edge" d="M 760 330 C 810 470 800 640 585 748"/>
  <path class="edge" d="M 440 316 L 440 352"/>
  <text x="460" y="342" class="lbl">לא</text>

  <!-- D3: allow -->
  <rect x="300" y="356" width="280" height="62" rx="12" class="box"/>
  <text x="440" y="382" class="t">התאמה לחוק Allow?</text>
  <text x="440" y="404" class="en">permissions.allow</text>
  <path class="edge" d="M 296 387 C 140 430 70 660 150 882"/>
  <text x="120" y="470" class="lbl">כן: ללא Prompt</text>
  <path class="edge" d="M 440 418 L 440 454"/>
  <text x="460" y="444" class="lbl">לא</text>

  <!-- D4: sandbox -->
  <rect x="290" y="458" width="300" height="76" rx="12" class="box"/>
  <text x="440" y="486" class="t">פקודת Bash בתוך ה-Sandbox?</text>
  <text x="440" y="510" class="s">מצב Auto-allow פעיל</text>
  <path class="edge" d="M 286 500 C 190 540 150 700 200 882"/>
  <text x="205" y="566" class="lbl">כן: רץ בתוך הגבולות</text>
  <path class="edge" d="M 440 534 L 440 570"/>
  <text x="460" y="560" class="lbl">לא</text>

  <!-- Mode box -->
  <rect x="170" y="574" width="540" height="136" rx="12" class="box"/>
  <text x="440" y="600" class="t" font-weight="bold">Permission Mode קובע את ברירת המחדל</text>
  <text x="440" y="624" class="s">default (Manual) ו-plan: בקשת אישור מהמשתמש</text>
  <text x="440" y="644" class="s">acceptEdits: עריכות קבצים אוטומטיות, השאר לפי הכללים</text>
  <text x="440" y="664" class="s">auto: בדיקת Classifier ברקע | dontAsk: דחייה אוטומטית</text>
  <text x="440" y="684" class="s">bypassPermissions: אישור אוטומטי (רק בסביבה מבודדת)</text>

  <!-- mode outputs -->
  <path class="edge" d="M 465 710 L 465 738"/>
  <path class="edge" d="M 260 710 C 230 720 205 728 185 738"/>
  <text x="238" y="734" class="en">auto</text>
  <path class="edge" d="M 640 710 C 680 760 692 820 690 882"/>
  <text x="678" y="762" class="en">dontAsk</text>
  <path class="edge" d="M 330 710 C 322 780 300 840 268 882"/>
  <text x="318" y="866" class="en">bypass</text>

  <!-- classifier -->
  <rect x="60" y="742" width="230" height="84" rx="12" class="box"/>
  <text x="175" y="770" class="t">בדיקת ה-Classifier</text>
  <text x="175" y="792" class="s">מודל בטיחות נפרד</text>
  <text x="175" y="812" class="en">auto mode</text>
  <path class="edge" d="M 180 826 L 210 882"/>
  <text x="152" y="860" class="lbl">מאשר</text>
  <path class="edge" d="M 290 806 C 420 852 520 868 556 898" stroke-dasharray="6 5"/>
  <text x="468" y="874" class="lbl">חוסם</text>

  <!-- user decision -->
  <rect x="340" y="742" width="250" height="84" rx="12" class="box"/>
  <text x="465" y="770" class="t">החלטת המשתמש</text>
  <text x="465" y="792" class="s">לאשר, לדחות, או לאשר לתמיד</text>
  <text x="465" y="812" class="en">Permission Prompt</text>
  <path class="edge" d="M 400 826 C 370 850 335 866 305 882"/>
  <text x="348" y="866" class="lbl">אישור</text>
  <path class="edge" d="M 540 826 C 580 850 618 866 648 882"/>
  <text x="606" y="860" class="lbl">דחייה</text>

  <!-- terminals -->
  <rect x="110" y="886" width="230" height="76" rx="12" class="box accent"/>
  <text x="225" y="914" class="t">הפעולה מתבצעת</text>
  <text x="225" y="938" class="en">Execution</text>
  <rect x="560" y="886" width="250" height="76" rx="12" class="deny"/>
  <text x="685" y="912" class="t">הפעולה נחסמת</text>
  <text x="685" y="934" class="s">Claude מקבל את הסיבה</text>
  <text x="685" y="952" class="s">ומחפש דרך חלופית</text>

  <text x="440" y="1000" class="s">חוקי Deny ו-Ask תמיד גוברים על המצב; חוקי Allow אינם משפיעים ב-bypassPermissions</text>
</svg>
